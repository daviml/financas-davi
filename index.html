function txModal(t){
  const isNew=!t;
  const dd=byGroup('diadia');
  t=t||{id:uid(),date:(UI.month===todayYM())?todayISO():UI.month+'-01',amount:0,cat:UI.filterCat&&itemById(UI.filterCat)?UI.filterCat:(S.lastCat&&itemById(S.lastCat)?S.lastCat:dd[0]?.id),method:null,desc:''};
  let cat=t.cat,method=t.method||itemById(cat)?.defMethod||S.lastMethod||'debito';
  openModal(`
    <div class="m-hd"><h3>${isNew?'Novo gasto':'Editar gasto'}</h3><button class="x" data-close>×</button></div>
    <div class="m-bd">
      <input class="in amount-in num" id="txAmt" inputmode="decimal" placeholder="R$ 0,00" value="${t.amount?NUM.format(t.amount):''}" autocomplete="off">
      <label class="f">Categoria</label>
      <div class="chips" id="txCats">${dd.map(i=>`<button class="chip ${i.id===cat?'on':''}" data-cat="${i.id}">${i.icon||''} ${esc(i.name.replace(/\s*\(.*\)/,''))}</button>`).join('')}</div>
      <label class="f">Forma de pagamento</label>
      <div class="chips" id="txMeth">${METHODS.map(([k,l])=>`<button class="chip ${k===method?'on':''}" data-m="${k}">${l}</button>`).join('')}</div>
      <div class="two">
        <div><label class="f">Data</label><input class="in" type="date" id="txDate" value="${t.date}"></div>
        <div><label class="f">Descrição (opcional)</label><input class="in" id="txDesc" value="${esc(t.desc)}" placeholder="Ex.: Posto Shell" list="descList"></div>
      </div>
      <datalist id="descList">${[...new Set(S.tx.map(x=>x.desc).filter(Boolean))].slice(-50).map(d=>`<option value="${esc(d)}">`).join('')}</datalist>
      <div class="hint" id="txHint"></div>
    </div>
    <div class="m-ft">
      ${isNew?'':'<button class="btn danger" id="txDel">Excluir</button>'}
      <span class="spacer"></span>
      ${isNew?'<button class="btn" id="txSaveMore">Salvar e lançar outro</button>':''}
      <button class="btn primary" id="txSave">Salvar</button>
    </div>`,m=>{
      const amt=m.querySelector('#txAmt');setTimeout(()=>amt.focus(),30);
      const hint=()=>{const c=calc(m.querySelector('#txDate').value.slice(0,7));const x=c.cats.find(z=>z.item.id===cat);const a=parseMoney(amt.value);
        if(!monthsList().includes(m.querySelector('#txDate').value.slice(0,7))){m.querySelector('#txHint').innerHTML='⚠ Esta data está fora do período do plano ('+ymLabel(S.settings.start)+' a '+ymLabel(S.settings.end)+') — o gasto não vai aparecer nos painéis.';return}
        if(x)m.querySelector('#txHint').innerHTML=x.plan?`${esc(x.item.name)}: depois deste gasto restam <b class="${x.plan-x.spent-a<0?'neg':''}">${fmt(x.plan-x.spent-a+(isNew?0:(t.cat===cat?t.amount:0)))}</b> de ${fmt(x.plan)}`:`Categoria sem orçamento — este gasto reduz a sobra do mês.`};
      m.querySelector('#txCats').onclick=e=>{const b=e.target.closest('[data-cat]');if(!b)return;cat=b.dataset.cat;m.querySelectorAll('#txCats .chip').forEach(c=>c.classList.toggle('on',c===b));const dm=itemById(cat)?.defMethod;if(dm){method=dm;m.querySelectorAll('#txMeth .chip').forEach(c=>c.classList.toggle('on',c.dataset.m===dm))}hint()};
      m.querySelector('#txMeth').onclick=e=>{const b=e.target.closest('[data-m]');if(!b)return;method=b.dataset.m;m.querySelectorAll('#txMeth .chip').forEach(c=>c.classList.toggle('on',c===b));hint()};
      amt.oninput=hint;m.querySelector('#txDate').onchange=hint;hint();
      const doSave=more=>{
        const a=parseMoney(amt.value);if(!(a>0)){amt.focus();amt.style.outline='2px solid var(--bad)';return}
        const date=m.querySelector('#txDate').value||todayISO();
        snap();
        const rec={...t,amount:a,cat,method,date,desc:m.querySelector('#txDesc').value.trim(),ts:t.ts||Date.now()};
        if(isNew)S.tx.push(rec);else S.tx[S.tx.findIndex(x=>x.id===t.id)]=rec;
        S.lastMethod=method;S.lastCat=cat;save();
        if(date.slice(0,7)!==UI.month&&monthsList().includes(date.slice(0,7))&&!more)UI.month=date.slice(0,7);
        render();toast((isNew?'Gasto lançado: ':'Gasto atualizado: ')+fmt(a),true);
        if(more){txModal()}else closeModal();
      };
      m.querySelector('#txSave').onclick=()=>doSave(false);
      const sm=m.querySelector('#txSaveMore');if(sm)sm.onclick=()=>doSave(true);
      m.querySelectorAll('.m-bd input').forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();doSave(false)}}));
      const del=m.querySelector('#txDel');if(del)del.onclick=()=>{snap();S.tx=S.tx.filter(x=>x.id!==t.id);save();closeModal();render();toast('Gasto excluído',true)};
    });
}

function quoteModal(it){
  const un=monthsList().filter(m=>planned(it,m)>0&&!isPaid(it,m));
  const firstOpen=openParcels(it)[0];
  openModal(`
    <div class="m-hd"><h3>Valor de quitação · ${esc(it.name)}</h3><button class="x" data-close>×</button></div>
    <div class="m-bd">
      <div class="t2">Veja no app do banco quanto custa quitar hoje. Com esse valor o app descobre os juros do contrato e passa a calcular o “à vista” sozinho nos próximos meses.</div>
      <div class="two">
        <div><label class="f">Valor para quitar hoje</label><input class="in num" id="qVal" inputmode="decimal" value="${it.quote?NUM.format(it.quote.amount):''}" placeholder="0,00"></div>
        <div><label class="f">Vence todo dia</label><input class="in" id="qDue" type="number" min="1" max="31" value="${it.due||''}" placeholder="ex.: 2"></div>
      </div>
      <label class="f">Esse valor quita as parcelas a partir de</label>
      <select class="in" id="qFrom">${un.map((m,k)=>`<option value="${m}" ${(it.quote?it.quote.from===m:firstOpen===m)?'selected':''}>${ymLong(m)} · ${un.length-k} parcela${un.length-k!==1?'s':''}</option>`).join('')}</select>
      <div class="hint">Escolha a primeira parcela que o valor de quitação cobre. As anteriores (já descontadas ou pagas) não entram.</div>
      <label class="check" id="qPrevWrap" style="display:none"><input type="checkbox" id="qPrev" checked> <span id="qPrevTxt"></span></label>
      <label class="check"><input type="checkbox" id="qAll" ${S.settings.consigRate==null||S.settings.consigRateFrom===it.id?'checked':''}> Usar esta taxa como estimativa para os outros consignados que ainda não têm valor informado</label>
      <div class="banner info" id="qRes" style="margin-top:12px"></div>
    </div>
    <div class="m-ft">${it.rate!=null?'<button class="btn danger" id="qDel">Remover</button><span class="spacer"></span>':''}<button class="btn" data-close>Cancelar</button><button class="btn primary" id="qSave">Salvar</button></div>`,m=>{
      const q=x=>m.querySelector(x);setTimeout(()=>q('#qVal').focus(),30);
      const calcR=()=>{
        const tmp={...it,due:parseInt(q('#qDue').value)||it.due};
        const ms=un.filter(x=>x>=q('#qFrom').value);
        const nom=ms.reduce((s,x)=>s+val(it,x),0),a=parseMoney(q('#qVal').value);
        return{r:solveRate(tmp,ms,a),ms,nom,a,tmp};
      };
      const upd=()=>{const prev=un.filter(x=>x<q('#qFrom').value);q('#qPrevWrap').style.display=prev.length?'':'none';q('#qPrevTxt').textContent=prev.length?`Marcar ${prev.length===1?'a parcela de '+ymLabel(prev[0]):'as '+prev.length+' parcelas de '+ymLabel(prev[0])+' a '+ymLabel(prev[prev.length-1])} como paga${prev.length>1?'s':''} (não entra${prev.length>1?'m':''} na quitação)`:'';const c=calcR();q('#qRes').innerHTML=c.a>0?(c.a>=c.nom?'O valor é igual ou maior que a soma das parcelas — sem desconto de juros.':`${c.ms.length} parcelas somam ${fmt(c.nom)} · você economiza <b class="pos">${fmt(c.nom-c.a)}</b> quitando hoje.<br>Juros do contrato ≈ <b>${pctRate(c.r)}</b> (${((Math.pow(1+c.r,12)-1)*100).toLocaleString('pt-BR',{maximumFractionDigits:1})}% ao ano).`):'Digite o valor de quitação.'};
      ['#qVal','#qDue'].forEach(x=>q(x).addEventListener('input',upd));q('#qFrom').addEventListener('change',upd);upd();
      q('#qSave').onclick=()=>{
        const c=calcR();if(!(c.a>0)){q('#qVal').focus();return}
        snap();
        it.due=c.tmp.due||null;it.rate=c.r;it.quote={amount:c.a,date:todayISO(),from:q('#qFrom').value};
        if(q('#qPrev').checked)un.filter(x=>x<q('#qFrom').value).forEach(x=>{const k=x+'|'+it.id;S.status[k]={...(S.status[k]||{amount:null}),paid:true,date:S.status[k]?.date||todayISO()}});
        if(q('#qAll').checked){S.settings.consigRate=c.r;S.settings.consigRateFrom=it.id}
        save();closeModal();render();toast('Juros de '+pctRate(c.r)+' salvos para '+it.name,true);
      };
      const del=q('#qDel');if(del)del.onclick=()=>{snap();delete it.rate;delete it.quote;if(S.settings.consigRateFrom===it.id){delete S.settings.consigRate;delete S.settings.consigRateFrom}save();closeModal();render();toast('Valor de quitação removido',true)};
    });
}

      </div>
      <div class="two">
        <div><label class="f">Valor que você pagou</label><input class="in num" id="poVal" inputmode="decimal" placeholder="${debtRate(it)?'à vista hoje ≈ '+NUM.format(debtCash(it).cash):'0,00'}"></div>
        <div><label class="f">Data do pagamento</label><input class="in" type="date" id="poDate" value="${todayISO()}"></div>
      </div>
      <div id="poPartial" style="display:none">
        <label class="f">Quantas parcelas o banco abateu?</label>
        <input class="in" id="poN" type="number" min="1" max="${unpaid.length}" value="1">
        <div class="hint">Saem as últimas parcelas do contrato (o fim fica mais cedo; o valor da parcela continua igual).</div>
      </div>
      <div id="poPlanWrap"></div>
      <div class="hint" id="poHint"></div>
    </div>
    <div class="m-ft"><button class="btn" data-close>Cancelar</button><button class="btn good" id="poSave">Registrar pagamento</button></div>`,m=>{
      let mode='total';
      const q=x=>m.querySelector(x);
      setTimeout(()=>q('#poVal').focus(),30);
      const payMonth=()=>clampMonth((q('#poDate').value||todayISO()).slice(0,7));
      const plannedQ=()=>{const pm=payMonth();return byGroup('quitacao').filter(i=>!i.payoffOf&&planned(i,pm)>0&&!isPaid(i,pm))};
      const removed=()=>{
        const pm=payMonth();
        if(mode==='total')return unpaid.filter(x=>x>=pm);
        const n=Math.max(1,Math.min(unpaid.length,parseInt(q('#poN').value)||1));
        return unpaid.slice(-n);
      };
      const upd=()=>{
        q('#poPartial').style.display=mode==='partial'?'':'none';
        const pq=plannedQ(),pm=payMonth();
        q('#poPlanWrap').innerHTML=pq.length?`<label class="check"><input type="checkbox" id="poUsePlan" checked> Usar a quitação já planejada de ${ymLabel(pm)} (${fmt(pq.reduce((s,i)=>s+planned(i,pm),0))}) — ela é trocada por este pagamento</label>`:'';
        const r=removed(),a=parseMoney(q('#poVal').value),nom=r.reduce((s,x)=>s+val(it,x),0);
        const before=unpaid.filter(x=>x<pm&&!r.includes(x));
        q('#poHint').innerHTML=r.length?`Saem <b>${r.length}</b> parcela${r.length!==1?'s':''} (${ymLabel(r[0])}${r.length>1?' a '+ymLabel(r[r.length-1]):''}), que somam ${fmt(nom)}.`+(a>0?` ${a<nom?'Economia de <b class="pos">'+fmt(nom-a)+'</b> em juros.':''}`:'')+(mode==='total'&&before.length?`<br>⚠ ${before.length} parcela(s) antes de ${ymLabel(pm)} ainda não foram marcadas como pagas e continuam no plano.`:''):'Nenhuma parcela a partir dessa data.';
      };
      q('#poMode').onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;mode=b.dataset.v;q('#poMode').querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b));upd()};
      ['#poVal','#poN'].forEach(x=>q(x).addEventListener('input',upd));q('#poDate').addEventListener('change',upd);upd();
      q('#poSave').onclick=()=>{
        const a=parseMoney(q('#poVal').value),r=removed(),date=q('#poDate').value||todayISO(),pm=payMonth();
        if(!(a>0)){q('#poVal').focus();q('#poVal').style.outline='2px solid var(--bad)';return}
        if(!r.length){alert('Não há parcelas para remover a partir dessa data.');return}
        const nom=r.reduce((s,x)=>s+val(it,x),0);
        if(!confirm(`Registrar ${mode==='total'?'quitação':'amortização'} de ${fmt(a)} e tirar ${r.length} parcela(s) de “${it.name}” do plano?`))return;
        snap();
        r.forEach(x=>{delete it.values[x];delete S.status[x+'|'+it.id]});
        const usePlan=q('#poUsePlan')&&q('#poUsePlan').checked;
        if(usePlan)plannedQ().forEach(i=>{delete i.values[pm]});
        const qi={id:uid(),name:'Quitação – '+it.name,group:'quitacao',values:{[pm]:a},due:null,icon:'',payoffOf:it.id};
        S.items.push(qi);S.status[pm+'|'+qi.id]={paid:true,amount:null,date};
        it.payoffs=[...(it.payoffs||[]),{date,amount:a,removed:r.length,mode,saved:round2(nom-a)}];
        save();closeModal();render();
        toast(`✓ ${mode==='total'?'Quitada':'Amortizada'}: ${r.length} parcela(s) a menos`,true);
      };
    });
}

function newBillModal(){
  openModal(`
    <div class="m-hd"><h3>Conta avulsa em ${ymLong(UI.month)}</h3><button class="x" data-close>×</button></div>
    <div class="m-bd">
      <label class="f">Nome</label><input class="in" id="nbName" placeholder="Ex.: IPVA, conserto, presente…">
      <div class="two">
        <div><label class="f">Valor</label><input class="in num" id="nbVal" inputmode="decimal" placeholder="0,00"></div>
        <div><label class="f">Grupo</label><select class="in" id="nbGroup"><option value="fixa">Contas fixas</option><option value="parcela">Parcelas e dívidas</option><option value="quitacao">Quitações</option></select></div>
      </div>
      <label class="check"><input type="checkbox" id="nbPaid" checked> Já está paga</label>
      <div class="hint">Para uma conta que se repete todo mês, use Ajustes → Novo item.</div>
    </div>
    <div class="m-ft"><button class="btn" data-close>Cancelar</button><button class="btn primary" id="nbSave">Adicionar</button></div>`,m=>{
      setTimeout(()=>m.querySelector('#nbName').focus(),30);
      m.querySelector('#nbSave').onclick=()=>{
        const name=m.querySelector('#nbName').value.trim(),v=parseMoney(m.querySelector('#nbVal').value);
        if(!name||!v){alert('Informe nome e valor.');return}
        snap();const it={id:uid(),name,group:m.querySelector('#nbGroup').value,values:{[UI.month]:v},due:null,icon:''};
        S.items.push(it);if(m.querySelector('#nbPaid').checked)S.status[UI.month+'|'+it.id]={paid:true,amount:null,date:todayISO()};
        save();closeModal();render();toast('Conta adicionada',true);
      };
    });
}

/* =========================================================
   Ações
   ========================================================= */
function exportJson(){
  const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='financas-backup-'+todayISO()+'.json';a.click();URL.revokeObjectURL(a.href);
}
function exportCsv(){
  const rows=[['Data','Valor','Categoria','Forma','Descrição']].concat([...S.tx].sort((a,b)=>a.date.localeCompare(b.date)).map(t=>[t.date,String(t.amount).replace('.',','),itemById(t.cat)?.name||'',methodLabel(t.method),t.desc||'']));
  const csv='﻿'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='gastos-'+todayISO()+'.csv';a.click();
}
function applyTheme(){
  const t=S.settings.theme||'auto';
  if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.dataset.theme=t;
}
function togglePaid(it,ym){
  snap();
  const k=ym+'|'+it.id,s=S.status[k];
  if(isPaid(it,ym)){
    if(autoPaid(it,ym))S.status[k]={amount:s?.amount??null,paid:false,manual:true,date:null};
    else if(s&&s.amount!=null)S.status[k]={...s,paid:false,date:null};else delete S.status[k];
    save();render();toast(it.name+' desmarcada',true)}
  else{const{manual,...rest}=s||{amount:null};S.status[k]={...rest,paid:true,date:todayISO()};save();render();toast('✓ '+it.name+' '+(it.group==='receita'?'recebido':it.group==='reserva'?'guardado':'paga')+' · '+fmt(val(it,ym)),true)}
}

document.addEventListener('click',e=>{
  if(e.target.closest('[data-close]')){closeModal();return}
  if(e.target.closest('#bottomNav [data-more]')){$('#moreSheet').classList.toggle('open');return}
  if(!e.target.closest('#moreSheet'))$('#moreSheet').classList.remove('open');
  const tabB=e.target.closest('#tabs [data-tab],#bottomNav [data-tab],#moreSheet [data-tab]');
  if(tabB){UI.tab=tabB.dataset.tab;render();scrollTo(0,0);return}
  const el=e.target.closest('[data-action]');if(!el)return;
  const a=el.dataset.action,id=el.dataset.id,m=el.dataset.m;
  switch(a){
    case 'prevMonth':{const ms=monthsList();const i=ms.indexOf(UI.month);if(i>0){UI.month=ms[i-1];render()}break}
    case 'nextMonth':{const ms=monthsList();const i=ms.indexOf(UI.month);if(i<ms.length-1){UI.month=ms[i+1];render()}break}
    case 'todayMonth':UI.month=clampMonth(todayYM());render();break;
    case 'goMonth':UI.month=m;UI.tab='inicio';render();scrollTo(0,0);break;
    case 'tab':UI.tab=el.dataset.tab;render();scrollTo(0,0);break;
    case 'theme':{const order=['auto','light','dark'];S.settings.theme=order[(order.indexOf(S.settings.theme||'auto')+1)%3];applyTheme();save();toast('Tema: '+{auto:'automático',light:'claro',dark:'escuro'}[S.settings.theme]);if(UI.tab==='ajustes')render();break}
    case 'setTheme':S.settings.theme=el.dataset.v;applyTheme();save();render();break;
    case 'addTx':txModal();break;
    case 'editTx':txModal(S.tx.find(t=>t.id===id));break;
    case 'filterCat':UI.filterCat=id;UI.tab='lanc';render();break;
    case 'togglePaid':if(e.target.closest('.edit'))return;togglePaid(itemById(id),m);break;
    case 'editBill':e.stopPropagation();billModal(itemById(id),m);break;
    case 'cell':cellModal(itemById(id),m);break;
    case 'newBill':newBillModal();break;
    case 'newIncome':incomeModal();break;
    case 'payoff':payoffModal(itemById(id));break;
    case 'quote':quoteModal(itemById(id));break;
    case 'payToSend':{const who=el.dataset.who,ym=UI.month;snap();let tot=0;
      byGroup('parcela').filter(i=>i.payTo===who&&planned(i,ym)>0&&!isPaid(i,ym)).forEach(i=>{const k=ym+'|'+i.id;const{manual,...r}=S.status[k]||{amount:null};S.status[k]={...r,paid:true,date:todayISO()};tot+=val(i,ym)});
      save();render();toast('✓ '+fmt(tot)+' enviado para '+who,true);break}
    case 'resBank':resBankModal();break;
    case 'syncNow':sync();break;
    case 'install':if(installEvt){installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;$('#installBtn').style.display='none'})}break;
    case 'syncOff':if(confirm('Desconectar este aparelho do GitHub? Os dados continuam salvos aqui e no GitHub.')){disconnectSync();render()}break;
    case 'syncCode':{const c=syncCode();const done=()=>toast('Código copiado — cole no campo do token no outro aparelho');if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(c).then(done,()=>prompt('Copie o código:',c));else prompt('Copie o código:',c);break}
    case 'syncOn':{
      const msg=$('#syMsg'),btn=el;
      let cfg;try{cfg=parseSyncInput($('#syRepo').value,$('#syToken').value)}catch(x){msg.innerHTML='<div class="banner warn" style="margin:10px 0 0">'+esc(x.message)+'</div>';return}
      btn.disabled=true;btn.textContent='Conectando…';
      connectSync(cfg).then(()=>{render();toast('☁ Conectado ao GitHub')}).catch(x=>{btn.disabled=false;btn.textContent='Conectar';msg.innerHTML='<div class="banner warn" style="margin:10px 0 0">⚠ '+esc(x.message)+'</div>'});
      break}
    case 'resAdjDel':if(confirm('Excluir este ajuste da reserva?')){snap();S.resAdj=(S.resAdj||[]).filter(a=>a.id!==id);save();render();toast('Ajuste excluído',true)}break;
    case 'payAll':{snap();const c=calc(UI.month);c.bills.filter(i=>!isPaid(i,UI.month)).forEach(i=>{const k=UI.month+'|'+i.id;S.status[k]={...(S.status[k]||{amount:null}),paid:true,date:todayISO()}});save();render();toast('Todas marcadas como pagas',true);break}
    case 'exportJson':exportJson();break;
    case 'importJson':$('#importFile').click();break;
    case 'exportCsv':exportCsv();break;
    case 'linkFile':linkFile();break;
    case 'reconnectFile':reconnectFile();break;
    case 'unlinkFile':unlinkFile();break;
    case 'resetAll':if(confirm('Apagar TODOS os dados (gastos, pagamentos e ajustes) e recomeçar do zero? Faça um backup antes.')){snap();S=seed();save();applyTheme();render();toast('Dados reiniciados',true)}break;
    case 'delItem':{const it=itemById(id);const n=S.tx.filter(t=>t.cat===id).length;if(!confirm(`Excluir “${it.name}”?`+(n?`\n${n} gasto(s) desta categoria ficarão “Sem categoria”.`:'')))return;snap();S.items=S.items.filter(i=>i.id!==id);Object.keys(S.status).forEach(k=>{if(k.endsWith('|'+id))delete S.status[k]});save();render();toast('Item excluído',true);break}
    case 'addItem':{
      const name=$('#niName').value.trim(),g=$('#niGroup').value,v=parseMoney($('#niVal').value),from=$('#niFrom').value,n=parseInt($('#niN').value)||0,due=parseInt($('#niDue').value)||null;
      if(!name){$('#niName').focus();return}
      snap();const values={};monthsList().filter(x=>x>=from).slice(0,n||undefined).forEach(x=>{if(v)values[x]=v});
      S.items.push({id:uid(),name,group:g,values,due,icon:g==='diadia'?'•':''});save();render();toast('“'+name+'” adicionado',true);break}
  }
});
document.addEventListener('keydown',e=>{
  if(modal.open)return;
  if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='n'||e.key==='N'){e.preventDefault();txModal()}
  else if(e.key==='ArrowLeft')document.querySelector('[data-action="prevMonth"]').click();
  else if(e.key==='ArrowRight')document.querySelector('[data-action="nextMonth"]').click();
});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(['dividas','reserva','orc'].includes(UI.tab))render()},150)});
// Outra aba abriu/alterou os dados → recarrega
addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){S=JSON.parse(e.newValue);snapRecs();render()}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')sync()});
addEventListener('online',()=>sync());
setInterval(()=>{if(document.visibilityState==='visible'&&!syncBusy)sync()},60000);

applyTheme();
snapRecs();
if(!localStorage.getItem(KEY)||dropVA(S))save();
render();
initFileHandle();
sync();
// PWA: instalável e abre sem internet (só quando servido por http/https, ex.: GitHub Pages)
let installEvt=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;$('#installBtn').style.display=''});
addEventListener('appinstalled',()=>{$('#installBtn').style.display='none';toast('App instalado ✓')});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
